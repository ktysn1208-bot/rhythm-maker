<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リズムツクール Final</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --accent: #ff9800;
            --danger: #e74c3c;
            --bg: #f0f4f8;
            --font-main: "M PLUS Rounded 1c", sans-serif;
            --q-bg: #fff8e1;
        }

        body {
            font-family: var(--font-main);
            text-align: center;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- モード切替タブ --- */
        #mode-switcher {
            background: #fff; display: flex; justify-content: center;
            padding: 5px 0 0 0; border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            padding: 8px 30px; cursor: pointer; font-weight: bold; font-size: 15px;
            color: #888; border: none; background: transparent; border-bottom: 4px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #555; background: #f9f9f9; }
        .tab-btn.active { color: var(--primary); border-bottom: 4px solid var(--primary); }
        .tab-btn.active.quiz-tab { color: var(--accent); border-bottom-color: var(--accent); }

        /* --- メインコンテナ --- */
        .app-mode { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
        .app-mode.active { display: flex; }

        /* --- 共通ヘッダー --- */
        header {
            background: #fff; padding: 8px 15px; border-bottom: 2px solid #e0e0e0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        h1 { margin: 0; font-size: 20px; color: #4a90e2; text-shadow: 1px 1px 0 #ebf5ff; }
        .quiz-title { color: var(--accent); }

        .settings-area {
            display: flex; gap: 10px; align-items: center; background: #f8f9fa;
            padding: 4px 12px; border-radius: 20px;
        }
        .setting-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; font-weight: bold; }
        select, input[type="number"] {
            padding: 3px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-weight: bold; font-size: 12px;
        }
        input[type="number"] { width: 45px; text-align: right; }
        
        .level-badge { background: #333; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        /* --- ツールバー --- */
        .toolbar {
            background: #fff; padding: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; z-index: 100;
        }
        button {
            font-family: var(--font-main); padding: 5px 10px; font-size: 13px;
            cursor: pointer; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 6px;
            font-weight: bold; color: #555; transition: all 0.1s;
        }
        button:hover { background: #e2e6ea; transform: translateY(-1px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-play { background: #2ecc71; color: white; border-color: #27ae60; padding: 5px 18px; }
        .btn-play:hover { background: #27ae60; }
        .btn-del { color: var(--danger); border-color: #fadbd8; }
        .btn-orange { background: #ffcc80; border-color: #ffb74d; color: #bf360c; }
        .btn-blue { background: #bbdefb; border-color: #90caf9; color: #0d47a1; }
        .btn-decide { background: #2ecc71; color: white; border: none; padding: 6px 25px; font-size: 15px; }

        /* --- ワークスペース --- */
        .workspace {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .staff-wrapper {
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 1000px; align-content: flex-start;
        }

        /* --- クイズモードレイアウト --- */
        #quiz-split-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        #question-area {
            flex: 0 0 140px; 
            background-color: var(--q-bg); border-bottom: 2px dashed #ccc;
            padding: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #answer-area {
            flex: 1; background-color: #fff; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; overflow-y: auto;
        }
        
        .area-label { font-size: 11px; color: #e67e22; font-weight: bold; margin-bottom: 2px; }

        /* --- 小節 --- */
        #question-area .measure { height: 100px; min-width: 50px; }

        .measure {
            background-color: white; height: 130px; display: flex; align-items: center;
            padding: 0 10px; position: relative; border-radius: 10px; min-width: 60px;
            border: 3px solid #e0e0e0; transition: all 0.2s;
        }
        .measure::before {
            content: attr(data-num); position: absolute; top: -20px; left: 5px; font-size: 12px; color: #aaa; font-weight: bold;
        }
        .measure.ok { border-color: var(--primary); background-color: #f7fbff; }
        .measure.under { border-color: #f1c40f; border-style: dashed; background-color: #fffff0; }
        .measure.over { border-color: var(--danger); background-color: #fff5f5; }
        .measure.hidden-question { background-color: #555; cursor: pointer; justify-content: center; }
        .measure.hidden-question::after { content: "?"; font-size: 30px; color: white; font-weight: bold; }
        .measure.playing { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,152,0, 0.4); transform: scale(1.02); }

        /* --- SVG --- */
        .note-group { position: relative; height: 100px; display: flex; align-items: flex-end; }
        .hitbox { position: absolute; bottom: 0; height: 100%; cursor: pointer; z-index: 10; width: 100%; }
        .hitbox:hover { background-color: rgba(0,0,0,0.05); border-radius: 4px; }
        .hitbox.selected { background-color: rgba(74, 144, 226, 0.2); border-radius: 4px; border: 1px dashed var(--primary); }
        .hitbox.playing { background-color: #ffe082 !important; border-radius: 4px; transform: scale(1.05); }
        .notation-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* --- 結果オーバーレイ --- */
        #result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 999;
        }
        #result-msg { font-size: 50px; color: white; margin-bottom: 20px; font-weight: bold; }
        .overlay-btn { background: white; border: none; padding: 10px 30px; font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold; margin: 0 10px; }
        .overlay-btn.next { background: var(--accent); color: white; }

        .hint-text { position: fixed; bottom: 5px; right: 10px; font-size: 10px; color: #aaa; }
    </style>
</head>
<body>

<div id="mode-switcher">
    <button class="tab-btn active" onclick="switchMode('creative')">🎨 自由創作</button>
    <button class="tab-btn quiz-tab" onclick="switchMode('quiz')">🎮 クイズ</button>
</div>

<div id="mode-creative" class="app-mode active">
    <header>
        <h1>🎵 自由創作モード</h1>
        <div class="settings-area">
            <div class="setting-item">
                拍子:
                <select id="c-timeSig" onchange="Creative.update()">
                    <option value="4/4" selected>4/4</option>
                    <option value="3/4">3/4</option>
                    <option value="2/4">2/4</option>
                    <option value="6/8">6/8</option>
                    <option value="3/8">3/8</option>
                    <option value="2/2">2/2</option>
                </select>
            </div>
            <div class="setting-item">
                <span id="c-tempoLabel">♩ =</span>
                <input type="number" id="c-tempo" value="120" min="30" max="300">
            </div>
        </div>
    </header>

    <div class="toolbar">
        <div>
            <button onclick="Creative.addNote(1)">♩</button>
            <button onclick="Creative.addNote(0.5)">♪</button>
            <button onclick="Creative.addNote(0.25)">♬</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button onclick="Creative.addRest(1)">4休</button>
            <button onclick="Creative.addRest(0.5)">8休</button>
            <button onclick="Creative.addRest(0.25)">16休</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button id="c-btn-merge" onclick="Creative.merge()">🔗 結合</button>
            <button class="btn-del" onclick="Creative.del()">消去</button>
            <button onclick="Creative.clear()">⚡ 全消去</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button class="btn-play" onclick="Creative.play()">▶ 再生</button>
        </div>
    </div>

    <div class="workspace" id="c-workspace">
        <div id="c-staff" class="staff-wrapper"></div>
    </div>
</div>

<div id="mode-quiz" class="app-mode">
    <header>
        <h1 class="quiz-title">🎮 リズムクイズ</h1>
        <div class="settings-area">
            <div class="setting-item">
                難易度:
                <select id="q-complexity" onchange="Quiz.updateInfo()">
                    <option value="0">かんたん (2分, 4分)</option>
                    <option value="1" selected>ふつう (8分まで)</option>
                    <option value="2">むずかしい (付点)</option>
                    <option value="3">激ムズ (16分)</option>
                </select>
            </div>
            <div class="setting-item">
                拍子:
                <select id="q-timeSig" onchange="Quiz.updateInfo()">
                    <option value="4/4">4/4</option>
                    <option value="2/4">2/4</option>
                    <option value="6/8">6/8</option>
                </select>
            </div>
            <div class="setting-item">
                小節:
                <select id="q-measures" onchange="Quiz.updateInfo()">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <span id="q-level-badge" class="level-badge">Lv. ?</span>
            <button class="btn-orange" onclick="Quiz.newGame()">🔄 次の問題</button>
        </div>
    </header>

    <div id="quiz-split-container">
        <div id="question-area">
            <div class="area-label">問題（？をクリックで部分再生）</div>
            <div id="q-staff-q" class="staff-wrapper" style="transform:scale(0.9); transform-origin: top center;"></div>
            <div style="margin-top:2px;">
                <button class="btn-orange" onclick="Quiz.playQ()">▶ 問題を再生</button>
                <button class="btn-del" onclick="AudioSys.stop()">■ 停止</button>
            </div>
        </div>
        <div id="answer-area">
            <div class="area-label">回答欄</div>
            <div id="q-staff-a" class="staff-wrapper"></div>
        </div>
    </div>

    <div class="toolbar">
        <div>
            <button onclick="Quiz.addNote(1)">♩</button>
            <button onclick="Quiz.addNote(0.5)">♪</button>
            <button onclick="Quiz.addNote(0.25)">♬</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button onclick="Quiz.addRest(1)">4休</button>
            <button onclick="Quiz.addRest(0.5)">8休</button>
            <button onclick="Quiz.addRest(0.25)">16休</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button id="q-btn-merge" onclick="Quiz.merge()">🔗 結合</button>
            <button class="btn-del" onclick="Quiz.del()">消去</button>
        </div>
        <div style="border-left:1px solid #ddd; padding-left:10px;">
            <button class="btn-blue" onclick="Quiz.playA()">▶ プレビュー</button>
            <button class="btn-decide" onclick="Quiz.check()">決定！</button>
        </div>
    </div>
</div>

<div id="result-overlay">
    <div id="result-msg">正解！</div>
    <div>
        <button class="overlay-btn" onclick="document.getElementById('result-overlay').style.display='none'">閉じる</button>
        <button class="overlay-btn next" onclick="Quiz.newGame()">次の問題へ</button>
    </div>
</div>

<div class="hint-text">
    [Shift+ドラッグ] 範囲選択 | [Del] 削除 | [結合] で音符をつなぐ
</div>

<script>
    // --- 共通定数・システム ---
    const NOTE_WIDTH = 45;
    const BEAM_HEIGHT = 5;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // 拍子定義
    const TIME_SIGS = {
        '4/4': { limit: 4.0, beatUnit: 1.0, groupUnit: 1.0, label: '♩' },
        '3/4': { limit: 3.0, beatUnit: 1.0, groupUnit: 1.0, label: '♩' },
        '2/4': { limit: 2.0, beatUnit: 1.0, groupUnit: 1.0, label: '♩' },
        '6/8': { limit: 3.0, beatUnit: 1.5, groupUnit: 1.5, label: '♩.' },
        '3/8': { limit: 1.5, beatUnit: 0.5, groupUnit: 1.5, label: '♪' },
        '2/2': { limit: 4.0, beatUnit: 2.0, groupUnit: 1.0, label: '𝅗𝅥' }
    };

    // --- モード切替 ---
    let currentMode = 'creative';
    function switchMode(mode) {
        currentMode = mode;
        AudioSys.stop();
        document.querySelectorAll('.app-mode').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`mode-${mode}`).classList.add('active');
        const btn = document.querySelector(mode === 'creative' ? '.tab-btn:first-child' : '.tab-btn:last-child');
        btn.classList.add('active');

        if(mode === 'creative') Creative.render();
        else Quiz.updateInfo(); 
    }

    // --- 共通オーディオシステム ---
    const AudioSys = {
        timeouts: [],
        stop: function() {
            this.timeouts.forEach(id => clearTimeout(id));
            this.timeouts = [];
            document.querySelectorAll('.measure').forEach(e => e.classList.remove('playing'));
            document.querySelectorAll('.hitbox').forEach(e => e.classList.remove('playing'));
        },
        play: async function(notes, sigKey, bpm, elementIdPrefix, isQuestionMode = false) {
            this.stop();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const config = TIME_SIGS[sigKey];
            const secPerBeat = 60 / bpm;
            const secPerQuarter = secPerBeat / config.beatUnit;
            
            let totalDur = 0;
            notes.forEach(n => totalDur += n.duration);
            
            const now = audioCtx.currentTime;

            // メトロノーム
            const totalBeats = totalDur / config.beatUnit;
            for(let k=0; k<=Math.ceil(totalBeats); k++) {
                const beatsPerMeasure = config.limit / config.beatUnit;
                const isStrong = (k % beatsPerMeasure === 0);
                this.playClick(now + (k * secPerBeat), isStrong);
            }

            // 音符再生
            let t = now;
            notes.forEach((n, i) => {
                if(n.type === 'clef') return;
                const dur = n.duration * secPerQuarter;
                const startT = t;
                let targetId = `${elementIdPrefix}${i}`;
                this.scheduleHighlight(targetId, (startT - now), dur);

                if(!n.isRest) this.playTone(startT, dur * 0.8);
                t += dur;
            });
        },
        playTone: function(t, d) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = 523.25;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); g.gain.setValueAtTime(0.5, t);
            g.gain.exponentialRampToValueAtTime(0.01, t + d); o.stop(t + d);
        },
        playClick: function(t, strong) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'square'; o.frequency.value = strong ? 1600 : 1000;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t); g.gain.setValueAtTime(strong?0.2:0.05, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); o.stop(t + 0.05);
        },
        scheduleHighlight: function(id, delay, dur) {
            const t1 = setTimeout(() => {
                const el = document.getElementById(id);
                if(el) el.classList.add('playing');
            }, delay * 1000);
            const t2 = setTimeout(() => {
                const el = document.getElementById(id);
                if(el) el.classList.remove('playing');
            }, (delay + dur * 0.9) * 1000);
            this.timeouts.push(t1, t2);
        },
        playEffect: function(isCorrect) {
            const t = audioCtx.currentTime;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if(isCorrect) {
                o.type='sine'; o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(1046,t+0.1);
                g.gain.setValueAtTime(0.5,t); g.gain.linearRampToValueAtTime(0,t+0.4); o.start(t); o.stop(t+0.4);
            } else {
                o.type='sawtooth'; o.frequency.setValueAtTime(100,t); o.frequency.linearRampToValueAtTime(50,t+0.3);
                g.gain.setValueAtTime(0.5,t); g.gain.linearRampToValueAtTime(0,t+0.3); o.start(t); o.stop(t+0.3);
            }
        }
    };

    // --- 共通レンダラー (SVG) ---
    const Renderer = {
        renderStaff: function(wrapperId, notes, sigKey, interactive, idPrefix, isQuestionHidden=false, onQuestionClick=null) {
            const wrapper = document.getElementById(wrapperId);
            wrapper.innerHTML = '';
            const config = TIME_SIGS[sigKey];
            const limit = config.limit;
            const groupUnit = config.groupUnit;

            let currentMeasure = this.createMeasure(1);
            let currentBeats = 0;
            let measureCount = 1;
            
            if(isQuestionHidden) {
                currentMeasure.classList.add('hidden-question');
                currentMeasure.onclick = () => onQuestionClick(0);
                currentMeasure.id = `${idPrefix}m-0`;
            }

            wrapper.appendChild(currentMeasure);

            let i = 0;
            while(i < notes.length) {
                const note = notes[i];
                if(note.type === 'clef') {
                    const div = document.createElement('div');
                    div.className = 'note-group'; div.style.width='50px';
                    let selectedClass = '';
                    if(interactive) {
                        const isSel = (currentMode==='creative' ? Creative : Quiz).isSelected(i);
                        if(isSel) selectedClass = 'selected';
                    }
                    div.innerHTML = `<div class="hitbox ${selectedClass}" onmousedown="Input.handleDown(event, ${i})"></div><svg class="notation-svg"><text x="15" y="70" font-size="38">🎼</text></svg>`;
                    currentMeasure.appendChild(div);
                    i++; continue;
                }

                if(currentBeats >= limit) {
                    this.validateMeasure(currentMeasure, currentBeats, limit);
                    measureCount++;
                    currentMeasure = this.createMeasure(measureCount);
                    if(isQuestionHidden) {
                        currentMeasure.classList.add('hidden-question');
                        currentMeasure.onclick = (function(mIdx){ return () => onQuestionClick(mIdx); })(measureCount-1);
                        currentMeasure.id = `${idPrefix}m-${measureCount-1}`;
                    }
                    wrapper.appendChild(currentMeasure);
                    currentBeats = 0;
                }

                let group = [i];
                let groupDur = note.duration;
                if(!note.isRest && note.duration < 1) {
                    let j = i+1;
                    while(j < notes.length) {
                        const next = notes[j];
                        if(next.type==='clef'||next.isRest||next.duration>=1) break;
                        const cb = Math.floor(currentBeats/groupUnit);
                        const nb = Math.floor((currentBeats+groupDur+next.duration-0.001)/groupUnit);
                        if(cb!==nb) break;
                        group.push(j); groupDur += next.duration; j++;
                    }
                }

                if(!isQuestionHidden) {
                    const el = this.renderNoteGroup(group, notes, interactive, idPrefix);
                    currentMeasure.appendChild(el);
                }

                group.forEach(k => currentBeats += notes[k].duration);
                i += group.length;
            }
            if(!isQuestionHidden) this.validateMeasure(currentMeasure, currentBeats, limit);
        },
        createMeasure: function(n) { const d = document.createElement('div'); d.className = 'measure'; d.dataset.num = n; return d; },
        validateMeasure: function(div, b, lim) {
            const v = Math.round(b*1000)/1000;
            div.classList.remove('ok','over','under');
            if(v===lim) div.classList.add('ok'); else if(v>lim) div.classList.add('over'); else if(v>0 && v<lim) div.classList.add('under');
        },
        renderNoteGroup: function(indices, allNotes, interactive, idPrefix) {
            const container = document.createElement('div');
            container.className = 'note-group';
            const w = indices.length * NOTE_WIDTH;
            container.style.width = w + 'px';
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS,"svg");
            svg.setAttribute("class","notation-svg"); svg.setAttribute("viewBox", `0 0 ${w} 100`);

            if(interactive) {
                indices.forEach((noteIdx, pos) => {
                    const hit = document.createElement('div');
                    const isSel = (currentMode==='creative' ? Creative : Quiz).isSelected(noteIdx);
                    hit.className = `hitbox ${isSel?'selected':''}`;
                    hit.id = `${idPrefix}${noteIdx}`;
                    hit.style.left = (pos*NOTE_WIDTH)+'px'; hit.style.width=NOTE_WIDTH+'px';
                    hit.onmousedown = (e) => Input.handleDown(e, noteIdx);
                    hit.onmouseenter = (e) => Input.handleEnter(e, noteIdx);
                    container.appendChild(hit);
                });
            } else {
                 indices.forEach((noteIdx, pos) => {
                     const hit = document.createElement('div');
                     hit.className = 'hitbox'; 
                     hit.id = `${idPrefix}${noteIdx}`;
                     hit.style.left = (pos*NOTE_WIDTH)+'px'; hit.style.width=NOTE_WIDTH+'px';
                     hit.style.pointerEvents = 'none';
                     container.appendChild(hit);
                 });
            }

            const isGroup = indices.length > 1;
            const baseY = 75; const stemTop = 25;
            
            indices.forEach((noteIdx, pos) => {
                const note = allNotes[noteIdx];
                const cx = (pos * NOTE_WIDTH) + (NOTE_WIDTH/2);
                if(note.isRest) {
                    this.drawRest(svg, cx, baseY, note.duration);
                } else {
                    const head = document.createElementNS(svgNS,"circle");
                    head.setAttribute("cx",cx); head.setAttribute("cy",baseY); head.setAttribute("r",6);
                    head.setAttribute("stroke","black"); head.setAttribute("stroke-width",2);
                    head.setAttribute("fill", note.duration>=2?"white":"black");
                    svg.appendChild(head);
                    if(note.duration<4) {
                        const stem = document.createElementNS(svgNS,"line");
                        stem.setAttribute("x1",cx+6); stem.setAttribute("y1",baseY);
                        stem.setAttribute("x2",cx+6); stem.setAttribute("y2",stemTop);
                        stem.setAttribute("stroke","black"); stem.setAttribute("stroke-width",2);
                        svg.appendChild(stem);
                    }
                    if(!isGroup && note.duration<1) {
                         const p = document.createElementNS(svgNS,"path");
                         let d = `M ${cx+6} ${stemTop} Q ${cx+24} ${stemTop+15} ${cx+24} ${stemTop+30}`;
                         if(note.duration<=0.25) d+=` M ${cx+6} ${stemTop+10} Q ${cx+24} ${stemTop+25} ${cx+24} ${stemTop+40}`;
                         p.setAttribute("d",d); p.setAttribute("stroke","black"); p.setAttribute("stroke-width",2); p.setAttribute("fill","none");
                         svg.appendChild(p);
                    }
                    if([1.5,0.75,0.375,3].includes(note.duration)) {
                        const dot = document.createElementNS(svgNS,"circle");
                        dot.setAttribute("cx",cx+16); dot.setAttribute("cy",baseY); dot.setAttribute("r",2.5); svg.appendChild(dot);
                    }
                }
                this.addLabel(svg, cx, note.duration);
            });

            if(isGroup) {
                const sx = (NOTE_WIDTH/2)+6; const ex = ((indices.length-1)*NOTE_WIDTH)+(NOTE_WIDTH/2)+6;
                this.drawBeam(svg, sx, ex, stemTop);
                indices.forEach((idx, pos) => {
                    if(allNotes[idx].duration > 0.25) return;
                    let cL=false, cR=false;
                    if(pos<indices.length-1 && allNotes[indices[pos+1]].duration<=0.25) cR=true;
                    if(pos>0 && allNotes[indices[pos-1]].duration<=0.25) cL=true;
                    const cx = (pos*NOTE_WIDTH)+(NOTE_WIDTH/2)+6; const by=stemTop+8;
                    if(cR) this.drawBeam(svg, cx, ((pos+1)*NOTE_WIDTH)+(NOTE_WIDTH/2)+6, by);
                    else if(!cL) {
                        if(pos>0) this.drawBeam(svg, cx-10, cx, by); else this.drawBeam(svg, cx, cx+10, by);
                    }
                });
            }
            container.appendChild(svg);
            return container;
        },
        drawRest: function(svg,x,y,d) {
             const ns="http://www.w3.org/2000/svg"; const p=document.createElementNS(ns,"path"); let ds="";
             if(d>=2){const r=document.createElementNS(ns,"rect");r.setAttribute("x",x-7);r.setAttribute("y",y-42);r.setAttribute("width",14);r.setAttribute("height",6);r.setAttribute("fill","black");svg.appendChild(r);return;}
             else if(d>=1){ds=`M ${x-2} ${y-38} Q ${x+6} ${y-40} ${x+5} ${y-30} L ${x-4} ${y-15} L ${x+2} ${y-5} C ${x+6} ${y-2} ${x+6} ${y+10} ${x} ${y+5} C ${x-4} ${y+2} ${x-2} ${y-5} ${x+2} ${y-5}`; p.setAttribute("stroke-width",3.5);}
             else if(d>=0.5){ds=`M ${x-4} ${y-22} A 3.5 3.5 0 1 1 ${x+2} ${y-18} M ${x+2} ${y-18} Q ${x-4} ${y+5} ${x+2} ${y+15}`; p.setAttribute("stroke-width",2.5); const h=document.createElementNS(ns,"circle");h.setAttribute("cx",x-2);h.setAttribute("cy",y-20);h.setAttribute("r",3.5);svg.appendChild(h);}
             else{ds=`M ${x+2} ${y-18} Q ${x-4} ${y-5} ${x+2} ${y+5} M ${x+2} ${y} Q ${x-4} ${y+15} ${x+2} ${y+25}`; p.setAttribute("stroke-width",2.5); const h1=document.createElementNS(ns,"circle");h1.setAttribute("cx",x-2);h1.setAttribute("cy",y-20);h1.setAttribute("r",3.5);svg.appendChild(h1); const h2=document.createElementNS(ns,"circle");h2.setAttribute("cx",x-2);h2.setAttribute("cy",y-2);h2.setAttribute("r",3.5);svg.appendChild(h2);}
             p.setAttribute("d",ds); p.setAttribute("fill","none"); p.setAttribute("stroke","black"); p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round"); svg.appendChild(p);
        },
        drawBeam: function(s,x1,x2,y){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y);l.setAttribute("x2",x2);l.setAttribute("y2",y);l.setAttribute("stroke","black");l.setAttribute("stroke-width",BEAM_HEIGHT);s.appendChild(l);},
        addLabel: function(s,x,d){const t=document.createElementNS("http://www.w3.org/2000/svg","text");let l='';if(d==2)l='2分';if(d==1)l='4分';if(d==0.5)l='8分';if(d==0.25)l='16分';if(d==0.75)l='付8';if(d==1.5)l='付4';if(d==3)l='付2';t.setAttribute("x",x);t.setAttribute("y",95);t.setAttribute("text-anchor","middle");t.setAttribute("font-size",9);t.setAttribute("fill","#aaa");t.textContent=l;s.appendChild(t);}
    };

    // --- 入力制御 ---
    const Input = {
        isDragging: false, dragStart: -1,
        handleDown: function(e, idx) { e.preventDefault(); this.isDragging=true; this.dragStart=idx; const sys = currentMode==='creative'?Creative:Quiz; if(e.shiftKey) sys.selectRange(Math.max(...sys.selected), idx); else { sys.selected.clear(); sys.selected.add(idx); sys.render(); } },
        handleEnter: function(e, idx) { if(this.isDragging && e.buttons===1) { const sys=currentMode==='creative'?Creative:Quiz; sys.selectRange(this.dragStart, idx); } },
        endDrag: function() { this.isDragging=false; }
    };
    window.addEventListener('mouseup', ()=>Input.endDrag());
    window.addEventListener('mouseleave', ()=>Input.endDrag());
    window.addEventListener('keydown', (e)=>{
        const sys = currentMode==='creative'?Creative:Quiz;
        if(e.key==='Backspace'||e.key==='Delete') sys.del();
        if(e.key==='ArrowRight') sys.moveCursor(1);
        if(e.key==='ArrowLeft') sys.moveCursor(-1);
    });

    // --- 自由創作モード ---
    const Creative = {
        notes: [{ type:'clef', duration:0 }], selected: new Set([0]),
        render: function() {
            const sig = document.getElementById('c-timeSig').value;
            const info = TIME_SIGS[sig];
            document.getElementById('c-tempoLabel').textContent = `${info.label} =`;
            Renderer.renderStaff('c-staff', this.notes, sig, true, 'c-note-');
            this.updateUI();
        },
        update: function() { this.render(); },
        updateUI: function() { document.getElementById('c-btn-merge').disabled = Array.from(this.selected).filter(i=>this.notes[i].type!=='clef').length<2; },
        isSelected: function(i) { return this.selected.has(i); },
        selectRange: function(a,b) { this.selected.clear(); for(let k=Math.min(a,b); k<=Math.max(a,b); k++) this.selected.add(k); this.render(); },
        moveCursor: function(d) { if(this.selected.size===0)return; const t=(d>0?Math.max(...this.selected):Math.min(...this.selected))+d; if(t>=0&&t<this.notes.length){this.selected.clear();this.selected.add(t);this.render();} },
        addNote: function(d) { this.addData({type:'note',duration:d,isRest:false}); },
        addRest: function(d) { this.addData({type:'note',duration:d,isRest:true}); },
        addData: function(o) {
            const t = this.selected.size>0 ? Math.max(...this.selected)+1 : this.notes.length;
            this.notes.splice(t, 0, o); this.selected.clear(); this.selected.add(t); this.render();
            setTimeout(()=>{const w=document.getElementById('c-workspace'); w.scrollTop=w.scrollHeight;},10);
        },
        del: function() {
            if(this.selected.size===0 || (this.selected.has(0)&&this.selected.size===1)) return;
            if(this.selected.has(0)) this.selected.delete(0);
            const s=Array.from(this.selected).sort((a,b)=>b-a); const next=Math.max(0, s[s.length-1]-1);
            s.forEach(i=>this.notes.splice(i,1)); this.selected.clear(); this.selected.add(next); this.render();
        },
        merge: function() {
            const idxs=Array.from(this.selected).sort((a,b)=>a-b);
            if(idxs.length<2)return;
            for(let i=0; i<idxs.length-1; i++) if(idxs[i]+1!==idxs[i+1]){ alert('離れた音符は結合できません'); return; }
            let tot=0, allR=true; idxs.forEach(i=>{ tot+=this.notes[i].duration; if(!this.notes[i].isRest)allR=false; });
            this.notes.splice(idxs[0], idxs.length, {type:'note', duration:tot, isRest:allR});
            this.selected.clear(); this.selected.add(idxs[0]); this.render();
        },
        clear: function() { if(confirm('全消去？')) { this.notes=[{type:'clef',duration:0}]; this.selected.clear(); this.selected.add(0); this.render(); } },
        play: function() {
            const sig = document.getElementById('c-timeSig').value;
            const bpm = parseInt(document.getElementById('c-tempo').value);
            AudioSys.play(this.notes, sig, bpm, 'c-note-');
        }
    };

    // --- クイズモード ---
    const Quiz = {
        question: [], qMeasuresData: [], answer: [{ type:'clef', duration:0 }], selected: new Set([0]), isRevealed: false,
        updateInfo: function() {
            const diffMap = {'4/4':1, '2/4':1.5, '2/2':1.5, '3/8':2, '6/8':3, '3/4':1.2};
            const sig = document.getElementById('q-timeSig').value;
            const mCount = parseInt(document.getElementById('q-measures').value);
            const comp = parseInt(document.getElementById('q-complexity').value) + 1;
            const lv = Math.round((diffMap[sig] || 1) * mCount * comp);
            document.getElementById('q-level-badge').textContent = `Lv. ${lv}`;
            this.render();
        },
        newGame: function() {
            this.isRevealed = false; document.getElementById('result-overlay').style.display='none';
            const sig = document.getElementById('q-timeSig').value;
            const measures = parseInt(document.getElementById('q-measures').value);
            const complexity = parseInt(document.getElementById('q-complexity').value);
            const config = TIME_SIGS[sig];
            const limit = config.limit;

            this.question = []; this.qMeasuresData = [];
            
            // 難易度別候補
            let candidates = [];
            if(complexity === 0) candidates = [2, 1]; // かんたん
            else if(complexity === 1) candidates = [1, 0.5, 0.5, 1]; // ふつう
            else if(complexity === 2) candidates = [1, 0.5, 1.5, 0.75]; // むずかしい
            else candidates = [1, 0.5, 0.25, 0.25, 1.5, 0.75]; // 激ムズ

            for(let m=0; m<measures; m++) {
                let measure = []; let current = 0;
                while(current < limit) {
                    const rem = limit - current;
                    const valid = candidates.filter(c => c <= rem + 0.001);
                    if(valid.length === 0) break;
                    const d = valid[Math.floor(Math.random()*valid.length)];
                    const isRest = (current>0 && Math.random()<0.2);
                    measure.push({type:'note', duration:d, isRest:isRest});
                    current += d;
                }
                if(current < limit) measure.push({type:'note', duration:limit-current, isRest:false});
                this.qMeasuresData.push(measure);
                this.question = this.question.concat(measure);
            }
            this.answer = [{ type:'clef', duration:0 }];
            this.selected.clear(); this.selected.add(0);
            this.render();
        },
        render: function() {
            const sig = document.getElementById('q-timeSig').value;
            if(!this.isRevealed) Renderer.renderStaff('q-staff-q', this.question, sig, false, 'q-note-', true, this.playQMeasure.bind(this));
            else Renderer.renderStaff('q-staff-q', this.question, sig, false, 'q-note-', false);
            Renderer.renderStaff('q-staff-a', this.answer, sig, true, 'a-note-');
            this.updateUI();
        },
        isSelected: function(i) { return this.selected.has(i); },
        selectRange: function(a,b) { this.selected.clear(); for(let k=Math.min(a,b); k<=Math.max(a,b); k++) this.selected.add(k); this.render(); },
        moveCursor: function(d) { if(this.selected.size===0)return; const t=(d>0?Math.max(...this.selected):Math.min(...this.selected))+d; if(t>=0&&t<this.answer.length){this.selected.clear();this.selected.add(t);this.render();} },
        addNote: function(d) { this.addData({type:'note',duration:d,isRest:false}); },
        addRest: function(d) { this.addData({type:'note',duration:d,isRest:true}); },
        addData: function(o) {
            const t = this.selected.size>0 ? Math.max(...this.selected)+1 : this.answer.length;
            this.answer.splice(t, 0, o); this.selected.clear(); this.selected.add(t); this.render();
            setTimeout(()=>{const w=document.getElementById('answer-area'); w.scrollTop=w.scrollHeight;},10);
        },
        del: function() {
            if(this.selected.size===0 || (this.selected.has(0)&&this.selected.size===1)) return;
            if(this.selected.has(0)) this.selected.delete(0);
            const s=Array.from(this.selected).sort((a,b)=>b-a); const next=Math.max(0, s[s.length-1]-1);
            s.forEach(i=>this.answer.splice(i,1)); this.selected.clear(); this.selected.add(next); this.render();
        },
        merge: function() {
            const idxs=Array.from(this.selected).sort((a,b)=>a-b);
            if(idxs.length<2)return;
            for(let i=0; i<idxs.length-1; i++) if(idxs[i]+1!==idxs[i+1]){ alert('離れた音符は結合できません'); return; }
            let tot=0, allR=true; idxs.forEach(i=>{ tot+=this.answer[i].duration; if(!this.answer[i].isRest)allR=false; });
            this.answer.splice(idxs[0], idxs.length, {type:'note', duration:tot, isRest:allR});
            this.selected.clear(); this.selected.add(idxs[0]); this.render();
        },
        updateUI: function() { document.getElementById('q-btn-merge').disabled = Array.from(this.selected).filter(i=>this.answer[i].type!=='clef').length<2; },
        playQ: function() {
            const sig = document.getElementById('q-timeSig').value;
            AudioSys.play(this.question, sig, 120, 'dummy', true); 
        },
        playQMeasure: function(mIdx) {
            const sig = document.getElementById('q-timeSig').value;
            const notes = this.qMeasuresData[mIdx];
            const el = document.getElementById(`q-note-m-${mIdx}`);
            if(el) {
                el.classList.add('playing');
                setTimeout(()=>el.classList.remove('playing'), notes.reduce((s,n)=>s+n.duration,0)*500 + 500);
            }
            AudioSys.play(notes, sig, 120, 'dummy');
        },
        playA: function() {
            const sig = document.getElementById('q-timeSig').value;
            AudioSys.play(this.answer, sig, 120, 'a-note-');
        },
        check: function() {
            // 新ロジック: リズム正規化して比較
            const normalize = (seq) => {
                const norm = [];
                seq.forEach(n => {
                    if(n.type==='clef') return;
                    const last = norm[norm.length-1];
                    // 休符同士は結合
                    if(n.isRest && last && last.isRest) {
                        last.duration += n.duration;
                    } else {
                        // コピーして追加
                        norm.push({ isRest:n.isRest, duration:n.duration });
                    }
                });
                return norm;
            };

            const qNorm = normalize(this.question);
            const aNorm = normalize(this.answer);

            let isCorrect = true;
            if(qNorm.length !== aNorm.length) isCorrect = false;
            else {
                for(let i=0; i<qNorm.length; i++) {
                    // duration比較 (float誤差許容)
                    if(Math.abs(qNorm[i].duration - aNorm[i].duration) > 0.01 || qNorm[i].isRest !== aNorm[i].isRest) {
                        isCorrect = false; break;
                    }
                }
            }
            
            this.isRevealed = true; this.render();
            const overlay = document.getElementById('result-overlay');
            const msg = document.getElementById('result-msg');
            overlay.style.display = 'flex';
            if(isCorrect) { msg.textContent = "正解！🎉"; msg.style.color = "#2ecc71"; } else { msg.textContent = "残念…💦"; msg.style.color = "#e74c3c"; }
            AudioSys.playEffect(isCorrect);
        }
    };
    
    switchMode('creative');
</script>
